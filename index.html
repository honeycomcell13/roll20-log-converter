<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="롤20 마크다운 채팅 백업을 읽기 좋은 HTML로 변환합니다.">
  <title>롤20 로그 편집기</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a1917'/%3E%3Cpath d='M17 16h25l7 7v25H17z' fill='%23f2e8cf'/%3E%3Cpath d='M42 16v8h7M24 32h18M24 39h13' stroke='%231a1917' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><a class="logo" href="#">ROLL20 LOG <span>EDITOR</span></a><div class="local">파일은 서버에 전송되지 않아요</div></header>
  <main>
    <section id="import-view" class="import-view">
      <div class="title-block"><p class="kicker">MARKDOWN TO HTML</p><h1>롤20 로그를<br>읽기 좋은 기록으로.</h1><p>GM에게 받은 마크다운 파일을 불러온 뒤 인장과 판정표를 유지하고, 원하는 위치에 핸드아웃을 추가해 HTML로 저장하세요.</p></div>
      <div class="import-card">
        <div id="dropzone" class="dropzone" tabindex="0" role="button"><input id="file-input" type="file" accept=".md,.markdown,.txt,text/markdown,text/plain"><strong>마크다운 파일을 놓으세요</strong><span>클릭해서 선택하거나 <kbd>Ctrl</kbd>+<kbd>V</kbd>로 붙여넣기</span></div>
        <div class="or"><span>또는 내용 직접 붙여넣기</span></div>
        <textarea id="paste-input" placeholder="롤20 채팅 마크다운을 여기에 붙여넣으세요."></textarea>
        <div class="row"><input id="session-title" placeholder="세션 제목 (선택)"><button id="convert-button" class="primary">로그 불러오기</button></div>
        <p id="import-error" class="error" hidden></p>
      </div>
    </section>

    <section id="editor-view" hidden>
      <div class="editor-head"><div><button id="reset-button" class="text-button">← 다른 파일</button><input id="title-input" class="title-input" aria-label="세션 제목"></div><div class="actions"><button id="preview-button">미리보기</button><button id="download-button" class="primary">HTML 저장</button></div></div>
      <div class="summary"><span id="message-count"></span><span id="character-count"></span><span id="handout-count"></span><label><input type="checkbox" id="embed-images" checked> 인장을 HTML 안에 저장</label></div>
      <div id="image-status" class="image-status" hidden></div>
      <div id="timeline" class="timeline"></div>
    </section>
  </main>

  <dialog id="handout-dialog">
    <form method="dialog" id="handout-form"><div class="dialog-head"><div><p class="kicker">INSERT</p><h2>핸드아웃 추가</h2></div><button value="cancel" class="close" aria-label="닫기">×</button></div>
      <label>형식<select id="handout-type"><option value="text">텍스트</option><option value="image">이미지</option></select></label>
      <label>제목<input id="handout-title" required placeholder="핸드아웃 제목"></label>
      <label id="text-field">본문<textarea id="handout-body" placeholder="본문을 입력하세요. 줄바꿈도 유지됩니다."></textarea></label>
      <label id="image-field" hidden>이미지<input id="handout-image" type="file" accept="image/*"><span id="image-name" class="file-name">이미지를 선택하세요</span></label>
      <div class="dialog-actions"><button value="cancel">취소</button><button id="add-handout" value="default" class="primary">추가</button></div>
    </form>
  </dialog>

  <dialog id="preview-dialog" class="preview-dialog"><div class="preview-top"><strong>HTML 미리보기</strong><button class="close" onclick="this.closest('dialog').close()">×</button></div><iframe id="preview-frame" title="HTML 미리보기"></iframe></dialog>
  <div id="toast" class="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
